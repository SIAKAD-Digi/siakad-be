name: Siakad-digi-be-dev

on:
  push:
    branches: [DEV]

jobs:
  build: 
    environment: DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 go build -o ./main ./cmd/app/main.go
      
      - name: Setup SSH key
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Upload binary to VPS via SCP
        run: scp -i key.pem -o StrictHostKeyChecking=no ./main ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/web/siakad-digi-be-dev

  deploy:
    environment: DEV
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd web/siakad-digi-be-dev
            chmod +x main
            sudo systemctl restart siakad-digi-be-dev
