services:
  app:
    image: siakad-digi-be-dev:latest
    container_name: siakad-digi-be-dev
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - loki
    restart: always
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: always
    networks:
      - monitoring
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/promtail.yaml
    command: -config.file=/etc/promtail/promtail.yaml
    restart: always
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  grafana-data:
  loki-data:
